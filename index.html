<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color"
      content="#166534">

<meta name="description"
      content="Daily Collection Management">

<title>Daily Collection</title>


<style>

/* =====================================================
   GLOBAL
   ===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f4f6;
  color: #111827;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
  height: 64px;
  background: #166534;
  color: white;
  padding: 8px 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.header h2 {
  margin: 0;
  font-size: 20px;
  line-height: 22px;
}

#connectionStatus {
  margin-top: 3px;
  font-size: 12px;
  line-height: 15px;
  font-weight: bold;
}

.online {
  color: #bbf7d0;
}

.offline {
  color: #fecaca;
}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.container {
  width: 100%;
  max-width: 600px;
  height: calc(100dvh - 64px);
  margin: 0 auto;
  padding: 7px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}


/* =====================================================
   CARDS
   ===================================================== */

.card {
  background: white;
  border-radius: 10px;
  padding: 9px;
  box-shadow: 0 1px 5px rgba(0,0,0,.08);
  flex-shrink: 0;
}


/* =====================================================
   STATUS CARD
   ===================================================== */

.status-card {
  padding: 7px 9px;
}

.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.status-box {
  background: #f9fafb;
  border-radius: 8px;
  padding: 6px;
  text-align: center;
  border: 1px solid #e5e7eb;
}

.status-number {
  display: block;
  font-size: 20px;
  font-weight: bold;
  color: #166534;
  line-height: 22px;
}

.status-label {
  display: block;
  font-size: 11px;
  color: #6b7280;
  margin-top: 1px;
}

.pending-box {
  background: #fff7ed;
  border-color: #fed7aa;
}

.pending-box .status-number {
  color: #c2410c;
}

.sync-info {
  font-size: 10px;
  color: #6b7280;
  text-align: center;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* =====================================================
   SEARCH
   ===================================================== */

.search-card {
  padding: 9px;
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  color: #166534;
  margin-bottom: 5px;
}

.search-row {
  display: flex;
  gap: 6px;
}

.search-input {
  flex: 1;
  min-width: 0;
}

input,
textarea {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 16px;
  background: white;
  color: #111827;
  font-family: inherit;
}

input {
  height: 42px;
  padding: 8px 10px;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #166534;
  box-shadow: 0 0 0 2px rgba(22,101,52,.12);
}

.search-button {
  width: 105px;
  height: 42px;
  margin: 0;
  padding: 0 7px;
  background: #2563eb;
  color: white;
  border: 0;
  border-radius: 7px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.search-button:active {
  transform: scale(.98);
}


/* =====================================================
   CUSTOMER CARD
   ===================================================== */

.customer {
  display: none;
  padding: 9px;
}


/* =====================================================
   CUSTOMER HEADER
   ===================================================== */

.customer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 7px;
  margin-bottom: 7px;
}

.customer-name {
  font-size: 18px;
  font-weight: bold;
  color: #111827;
  line-height: 21px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.customer-crf {
  font-size: 12px;
  color: #166534;
  font-weight: bold;
  margin-top: 2px;
}


/* =====================================================
   CUSTOMER DETAILS
   ===================================================== */

.customer-details {
  background: #f9fafb;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
  padding: 7px;
}

.detail-row {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 5px;
  padding: 3px 0;
  font-size: 12px;
  line-height: 15px;
}

.detail-label {
  color: #6b7280;
  font-weight: bold;
}

.detail-value {
  color: #111827;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


/* =====================================================
   PAYMENT SUMMARY
   ===================================================== */

.payment-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 7px;
}

.payment-status {
  border-radius: 8px;
  padding: 6px;
  text-align: center;
}

.last-payment {
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
}

.paid-till {
  background: #ecfdf5;
  border: 1px solid #bbf7d0;
}

.payment-status-label {
  font-size: 9px;
  color: #6b7280;
  font-weight: bold;
  display: block;
}

.payment-status-value {
  font-size: 12px;
  font-weight: bold;
  color: #111827;
  display: block;
  margin-top: 2px;
}

.paid-till .payment-status-value {
  color: #166534;
}


/* =====================================================
   COLLECTION MONTH
   ===================================================== */

.collection-box {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  padding: 7px;
  margin-top: 7px;
}

.collection-title {
  font-size: 12px;
  color: #1e40af;
  font-weight: bold;
  margin-bottom: 4px;
}

#paymentFor {
  height: 38px;
  border-color: #93c5fd;
  background: white;
}


/* =====================================================
   REMARKS
   ===================================================== */

.remarks-box {
  margin-top: 6px;
}

.remarks-label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 3px;
  color: #374151;
}

textarea {
  height: 38px;
  min-height: 38px;
  resize: none;
  padding: 8px 10px;
  font-size: 14px;
}


/* =====================================================
   SAVE BUTTON
   ===================================================== */

.save-button {
  width: 100%;
  height: 45px;
  margin: 7px 0 0;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: #16a34a;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.save-button:active {
  transform: scale(.98);
}

.save-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}


/* =====================================================
   MESSAGES
   ===================================================== */

.message {
  display: none;
  padding: 7px 9px;
  margin-top: 6px;
  border-radius: 7px;
  font-size: 12px;
  line-height: 15px;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
  border: 1px solid #bbf7d0;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #fecaca;
}


/* =====================================================
   SEARCH MESSAGE
   ===================================================== */

#searchMessage {
  margin-top: 5px;
}


/* =====================================================
   SMALL PHONES
   ===================================================== */

@media (max-height: 650px) {

  .header {
    height: 58px;
  }

  .container {
    height: calc(100dvh - 58px);
    padding: 5px;
    gap: 4px;
  }

  .card {
    padding: 7px;
  }

  .customer-name {
    font-size: 16px;
  }

  .detail-row {
    padding: 2px 0;
  }

  .payment-summary {
    margin-top: 5px;
  }

  .collection-box {
    margin-top: 5px;
  }

  .remarks-box {
    margin-top: 4px;
  }

  .save-button {
    height: 42px;
    margin-top: 5px;
  }

}


/* =====================================================
   VERY SMALL PHONES
   ===================================================== */

@media (max-height: 560px) {

  .header {
    height: 52px;
  }

  .header h2 {
    font-size: 17px;
    line-height: 18px;
  }

  #connectionStatus {
    font-size: 10px;
    line-height: 11px;
  }

  .container {
    height: calc(100dvh - 52px);
    padding: 4px;
    gap: 3px;
  }

  .card {
    padding: 6px;
  }

  .status-number {
    font-size: 17px;
  }

  .search-input,
  .search-button {
    height: 38px;
  }

  .customer-name {
    font-size: 15px;
    line-height: 17px;
  }

  .detail-row {
    font-size: 11px;
    line-height: 13px;
  }

  .payment-status {
    padding: 4px;
  }

  .collection-box {
    padding: 5px;
  }

  #paymentFor {
    height: 34px;
  }

  textarea {
    height: 32px;
    min-height: 32px;
  }

  .save-button {
    height: 39px;
    font-size: 14px;
  }

}


/* =====================================================
   LANDSCAPE
   ===================================================== */

@media (orientation: landscape) and (max-height: 500px) {

  .header {
    height: 48px;
  }

  .header h2 {
    font-size: 16px;
    line-height: 17px;
  }

  #connectionStatus {
    font-size: 9px;
  }

  .container {
    height: calc(100dvh - 48px);
    max-width: 750px;
    display: grid;
    grid-template-columns: 0.8fr 1.2fr;
    grid-template-rows: auto 1fr;
    gap: 5px;
  }

  .status-card {
    grid-column: 1;
  }

  .search-card {
    grid-column: 1;
  }

  .customer {
    grid-column: 2;
    grid-row: 1 / span 2;
  }

}


</style>

</head>


<body>


<!-- ===================================================
     HEADER
     =================================================== -->

<header class="header">

  <h2>Daily Collection</h2>

  <div id="connectionStatus">
    Checking connection...
  </div>

</header>


<main class="container">


<!-- ===================================================
     STATUS
     =================================================== -->

<div class="card status-card">

  <div class="status-grid">

    <div class="status-box">

      <span
        id="customerCount"
        class="status-number">
        0
      </span>

      <span class="status-label">
        Customers
      </span>

    </div>


    <div class="status-box pending-box">

      <span
        id="pendingCount"
        class="status-number">
        0
      </span>

      <span class="status-label">
        Pending Sync
      </span>

    </div>

  </div>


  <div
    id="syncInfo"
    class="sync-info">

    Starting...

  </div>

</div>


<!-- ===================================================
     SEARCH
     =================================================== -->

<div class="card search-card">

  <div class="section-title">
    🔎 FIND CUSTOMER
  </div>


  <div class="search-row">

    <input
      id="crfSearch"
      class="search-input"
      type="text"
      placeholder="Enter CRF e.g. 001"
      autocomplete="off"
      autocapitalize="characters"
      inputmode="text"
    >


    <button
      id="searchButton"
      class="search-button"
      onclick="searchCustomer()">

      SEARCH

    </button>

  </div>


  <div
    id="searchMessage"
    class="message">
  </div>

</div>


<!-- ===================================================
     CUSTOMER
     =================================================== -->

<div
  id="customerCard"
  class="card customer">


  <!-- CUSTOMER HEADER -->

  <div class="customer-header">

    <div style="min-width:0;">

      <div
        id="customerName"
        class="customer-name">
      </div>

      <div
        id="customerCRF"
        class="customer-crf">
      </div>

    </div>

  </div>


  <!-- CUSTOMER DETAILS -->

  <div class="customer-details">


    <div class="detail-row">

      <div class="detail-label">
        📍 Address
      </div>

      <div
        id="customerAddress"
        class="detail-value">
      </div>

    </div>


    <div class="detail-row">

      <div class="detail-label">
        📞 Phone
      </div>

      <div
        id="customerPhone"
        class="detail-value">
      </div>

    </div>


    <div class="detail-row">

      <div class="detail-label">
        Area
      </div>

      <div
        id="customerArea"
        class="detail-value">
      </div>

    </div>


  </div>


  <!-- PAYMENT SUMMARY -->

  <div class="payment-summary">


    <div class="payment-status last-payment">

      <span class="payment-status-label">
        LAST PAYMENT
      </span>

      <span
        id="lastPaidDate"
        class="payment-status-value">
        No previous payment
      </span>

    </div>


    <div class="payment-status paid-till">

      <span class="payment-status-label">
        PAID TILL
      </span>

      <span
        id="paidThrough"
        class="payment-status-value">
        -
      </span>

    </div>


  </div>


  <!-- COLLECTION MONTH -->

  <div class="collection-box">

    <div class="collection-title">
      📅 COLLECTION FOR
    </div>

    <input
      id="paymentFor"
      type="month"
    >

  </div>


  <!-- REMARKS -->

  <div class="remarks-box">

    <label
      class="remarks-label"
      for="remarks">

      Remarks (optional)

    </label>

    <textarea
      id="remarks"
      placeholder="Optional">
    </textarea>

  </div>


  <!-- SAVE MESSAGE -->

  <div
    id="saveMessage"
    class="message">
  </div>


  <!-- SAVE BUTTON -->

  <button
    id="bottomSaveButton"
    class="save-button"
    onclick="saveCollection()">

    💰 SAVE COLLECTION

  </button>


</div>


</main>


<script>


/********************************************************
 * GOOGLE APPS SCRIPT WEB APP URL
 *
 * PASTE YOUR REAL WEB APP URL HERE.
 ********************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLLhoQmLtoMPQBpvraumj5nNGqtZGFLo9VbTC077SxH5AKWpow5aOaLUDMpdA7dlXJQQ/exec';


/********************************************************
 * SETTINGS
 ********************************************************/

const AUTO_SYNC_INTERVAL = 5000;

let syncInProgress = false;

let currentCustomer = null;


/********************************************************
 * LOCAL STORAGE KEYS
 ********************************************************/

const CUSTOMER_KEY =
  'dailyCollectionCustomers';

const PAYMENT_KEY =
  'dailyCollectionPayments';

const PENDING_KEY =
  'dailyCollectionPending';

const AGENT_KEY =
  'dailyCollectionAgent';


/********************************************************
 * START APPLICATION
 ********************************************************/

function startApplication() {

  console.log(
    'Daily Collection application started'
  );

  updateConnectionStatus();

  updateCounts();

  setDefaultPaymentFor();


  /*
   * Focus CRF search box.
   */

  setTimeout(
    function() {

      const input =
        document.getElementById(
          'crfSearch'
        );

      if (input) {

        input.focus();

      }

    },
    300
  );


  /*
   * Try synchronization immediately if online.
   */

  if (navigator.onLine) {

    syncNow();

  }

}


/********************************************************
 * START
 ********************************************************/

startApplication();


/********************************************************
 * ONLINE
 ********************************************************/

window.addEventListener(
  'online',
  function() {

    updateConnectionStatus();

    syncNow();

  }
);


/********************************************************
 * OFFLINE
 ********************************************************/

window.addEventListener(
  'offline',
  function() {

    updateConnectionStatus();

    updateSyncInfo(
      'Offline • Collections saved on phone'
    );

  }
);


/********************************************************
 * CONNECTION STATUS
 ********************************************************/

function updateConnectionStatus() {

  const element =
    document.getElementById(
      'connectionStatus'
    );

  if (!element) {

    return;

  }


  if (navigator.onLine) {

    element.innerText =
      '🟢 Online • Auto Sync ON';

    element.className =
      'online';

  } else {

    element.innerText =
      '🔴 Offline • Saved on phone';

    element.className =
      'offline';

  }

}


/********************************************************
 * SYNC INFO
 ********************************************************/

function updateSyncInfo(message) {

  const element =
    document.getElementById(
      'syncInfo'
    );

  if (element) {

    element.innerText =
      message;

  }

}


/********************************************************
 * LOCAL STORAGE - CUSTOMERS
 ********************************************************/

function getCustomers() {

  try {

    const data =
      localStorage.getItem(
        CUSTOMER_KEY
      );


    if (!data) {

      return [];

    }


    const customers =
      JSON.parse(data);


    return Array.isArray(customers)
      ? customers
      : [];


  } catch (error) {

    console.error(
      'getCustomers error:',
      error
    );

    return [];

  }

}


/********************************************************
 * LOCAL STORAGE - PAYMENTS
 ********************************************************/

function getPayments() {

  try {

    const data =
      localStorage.getItem(
        PAYMENT_KEY
      );


    if (!data) {

      return {};

    }


    const payments =
      JSON.parse(data);


    return payments &&
           typeof payments === 'object'
      ? payments
      : {};


  } catch (error) {

    console.error(
      'getPayments error:',
      error
    );

    return {};

  }

}


/********************************************************
 * LOCAL STORAGE - PENDING
 ********************************************************/

function getPending() {

  try {

    const data =
      localStorage.getItem(
        PENDING_KEY
      );


    if (!data) {

      return [];

    }


    const pending =
      JSON.parse(data);


    return Array.isArray(pending)
      ? pending
      : [];


  } catch (error) {

    console.error(
      'getPending error:',
      error
    );

    return [];

  }

}


/********************************************************
 * COUNTS
 ********************************************************/

function updateCounts() {

  const customerCount =
    document.getElementById(
      'customerCount'
    );

  const pendingCount =
    document.getElementById(
      'pendingCount'
    );


  if (customerCount) {

    customerCount.innerText =
      getCustomers().length;

  }


  if (pendingCount) {

    pendingCount.innerText =
      getPending().length;

  }

}


/********************************************************
 * DEFAULT PAYMENT MONTH
 ********************************************************/

function setDefaultPaymentFor() {

  const input =
    document.getElementById(
      'paymentFor'
    );


  if (!input) {

    return;

  }


  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    )
    .padStart(
      2,
      '0'
    );


  input.value =
    year + '-' + month;

}


/********************************************************
 * SEARCH CUSTOMER
 ********************************************************/

function searchCustomer() {

  const input =
    document.getElementById(
      'crfSearch'
    );


  if (!input) {

    return;

  }


  const enteredValue =
    input.value
      .trim()
      .toUpperCase();


  /*
   * Reset Payment For to current month.
   */

  setDefaultPaymentFor();


  if (!enteredValue) {

    showMessage(
      'searchMessage',
      'Please enter a CRF number.',
      false
    );

    return;

  }


  /*
   * Convert short CRF to full CRF.
   *
   * 001    -> CRF001
   * 01     -> CRF01
   * 1      -> CRF1
   * CRF001 -> CRF001
   */

  let crf =
    enteredValue;


  if (!crf.startsWith('CRF')) {

    crf =
      'CRF' + crf;

  }


  const customers =
    getCustomers();


  const customer =
    customers.find(
      function(item) {

        const customerCRF =
          String(
            item.crf || ''
          )
          .trim()
          .toUpperCase();


        return customerCRF === crf;

      }
    );


  if (!customer) {

    document.getElementById(
      'customerCard'
    ).style.display =
      'none';


    input.value =
      enteredValue;


    showMessage(

      'searchMessage',

      'Customer ' +
      crf +
      ' not found. Please wait for synchronization to complete.',

      false

    );


    if (navigator.onLine) {

      syncNow();

    }

    return;

  }


  currentCustomer =
    customer;


  input.value =
    enteredValue;


  hideMessage(
    'searchMessage'
  );


  displayCustomer(
    customer
  );

}


/********************************************************
 * DISPLAY CUSTOMER
 ********************************************************/

function displayCustomer(customer) {

  const card =
    document.getElementById(
      'customerCard'
    );


  if (!card) {

    return;

  }


  card.style.display =
    'block';


  document.getElementById(
    'customerName'
  ).innerText =
    customer.name || '';


  document.getElementById(
    'customerCRF'
  ).innerText =
    customer.crf || '';


  document.getElementById(
    'customerAddress'
  ).innerText =
    customer.address || '';


  document.getElementById(
    'customerPhone'
  ).innerText =
    customer.phone || '';


  document.getElementById(
    'customerArea'
  ).innerText =
    customer.area || '';


  /*
   * Local payment data first.
   */

  const payments =
    getPayments();


  const key =
    String(
      customer.crf || ''
    )
    .trim()
    .toUpperCase();


  const payment =
    payments[key];


  if (payment) {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      formatDisplayDate(
        payment.lastPaymentDate
      ) ||
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      formatPaidTill(
        payment.paidThrough
      ) ||
      '-';

  } else {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      '-';

  }


  /*
   * Scroll is not used.
   * Move focus to collection month.
   */

  setTimeout(
    function() {

      const paymentFor =
        document.getElementById(
          'paymentFor'
        );

      if (paymentFor) {

        paymentFor.focus();

      }

    },
    100
  );

}


/********************************************************
 * SAVE COLLECTION
 ********************************************************/

function saveCollection() {

  if (!currentCustomer) {

    showMessage(

      'saveMessage',

      'Please search for a customer first.',

      false

    );

    return;

  }


  const paymentForDate =
    getPaymentForDate();


  if (!paymentForDate) {

    showMessage(

      'saveMessage',

      'Please select the collection month.',

      false

    );

    return;

  }


  const remarksElement =
    document.getElementById(
      'remarks'
    );


  const remarks =
    remarksElement
      ? remarksElement.value.trim()
      : '';


  const transactionDate =
    new Date();


  const pending =
    getPending();


  const transactionId =
    createTransactionId();


  const transaction = {

    transactionId:
      transactionId,

    transactionDate:
      transactionDate.toISOString(),

    coveredDate:
      paymentForDate.toISOString(),

    crf:
      String(
        currentCustomer.crf || ''
      )
      .trim()
      .toUpperCase(),

    agent:
      getAgent(),

    remarks:
      remarks

  };


  /*
   * Add transaction to pending.
   */

  pending.push(
    transaction
  );


  /*
   * Save immediately to phone.
   */

  localStorage.setItem(

    PENDING_KEY,

    JSON.stringify(
      pending
    )

  );


  /*
   * Update local payment display.
   */

  updateLocalPaymentSummary(

    currentCustomer.crf,

    transactionDate,

    paymentForDate

  );


  updateCounts();


  /*
   * Clear remarks.
   */

  if (remarksElement) {

    remarksElement.value =
      '';

  }


  /*
   * Show success immediately.
   */

  showMessage(

    'saveMessage',

    navigator.onLine

      ? '✅ Collection saved. Syncing...'

      : '✅ Collection saved offline. It will sync when internet returns.',

    true

  );


  /*
   * Immediately synchronize.
   */

  if (navigator.onLine) {

    syncNow();

  }


  /*
   * Return focus to CRF after a short delay.
   */

  setTimeout(
    function() {

      const input =
        document.getElementById(
          'crfSearch'
        );


      if (input) {

        input.focus();

        input.select();

      }

    },
    500
  );

}


/********************************************************
 * LOCAL PAYMENT SUMMARY
 ********************************************************/

function updateLocalPaymentSummary(
  crf,
  transactionDate,
  paymentForDate
) {

  const payments =
    getPayments();


  const key =
    String(
      crf
    )
    .trim()
    .toUpperCase();


  const existing =
    payments[key];


  let lastPaymentDate =
    new Date(
      transactionDate
    );


  if (
    existing &&
    existing.lastPaymentDate
  ) {

    const existingTransactionDate =
      new Date(
        existing.lastPaymentDate
      );


    if (
      !isNaN(
        existingTransactionDate.getTime()
      ) &&
      existingTransactionDate >
      lastPaymentDate
    ) {

      lastPaymentDate =
        existingTransactionDate;

    }

  }


  let paidThrough =
    new Date(
      paymentForDate
    );


  if (
    existing &&
    existing.paidThrough
  ) {

    const existingPaidThrough =
      new Date(
        existing.paidThrough
      );


    if (
      !isNaN(
        existingPaidThrough.getTime()
      ) &&
      existingPaidThrough >
      paidThrough
    ) {

      paidThrough =
        existingPaidThrough;

    }

  }


  payments[key] = {

    lastPaymentDate:
      lastPaymentDate.toISOString(),

    paidThrough:
      paidThrough.toISOString()

  };


  localStorage.setItem(

    PAYMENT_KEY,

    JSON.stringify(
      payments
    )

  );


  if (currentCustomer) {

    displayCustomer(
      currentCustomer
    );

  }

}


/********************************************************
 * SYNCHRONIZATION
 ********************************************************/

async function syncNow() {

  if (!navigator.onLine) {

    updateSyncInfo(
      'Offline • Waiting for internet'
    );

    return;

  }


  if (syncInProgress) {

    return;

  }


  /*
   * API URL check.
   */

  if (
    !API_URL ||
    API_URL.trim() === '' ||
    API_URL ===
      'paste the url here'
  ) {

    console.error(
      'API URL is not configured.'
    );


    updateSyncInfo(
      'Google Sheet URL not configured'
    );

    return;

  }


  syncInProgress =
    true;


  try {

    const pending =
      getPending();


    updateSyncInfo(

      pending.length > 0

        ? 'Syncing ' +
          pending.length +
          ' collection(s)...'

        : 'Checking collection data...'

    );


    console.log(
      'Pending before sync:',
      pending
    );


    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'sync',

              pending:
                pending,

              agent:
                getAgent()

            })

        }

      );


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      'Server response:',
      result
    );


    if (!result) {

      throw new Error(
        'Empty response from server.'
      );

    }


    /*
     * Confirmed transactions.
     */

    const syncedIds =
      new Set(

        Array.isArray(
          result.syncedIds
        )

          ? result.syncedIds

          : []

      );


    /*
     * Remove ONLY confirmed transactions.
     */

    if (
      syncedIds.size > 0
    ) {

      const remaining =
        pending.filter(

          function(item) {

            return !syncedIds.has(
              item.transactionId
            );

          }

        );


      localStorage.setItem(

        PENDING_KEY,

        JSON.stringify(
          remaining
        )

      );


      console.log(
        'Removed synced transactions:',
        syncedIds.size
      );

    }


    /*
     * SAVE CUSTOMERS
     */

    if (
      Array.isArray(
        result.customers
      )
    ) {

      localStorage.setItem(

        CUSTOMER_KEY,

        JSON.stringify(
          result.customers
        )

      );

    }


    /*
     * SAVE SERVER PAYMENT SUMMARY
     */

    if (
      result.payments &&
      typeof result.payments === 'object'
    ) {

      mergeServerPayments(
        result.payments,
        getPending()
      );

    } else {

      mergeServerPayments(
        {},
        getPending()
      );

    }


    /*
     * UPDATE COUNTS
     */

    updateCounts();


    /*
     * REFRESH CURRENT CUSTOMER
     */

    if (currentCustomer) {

      const customers =
        getCustomers();


      const currentCRF =
        String(
          currentCustomer.crf || ''
        )
        .trim()
        .toUpperCase();


      const updated =
        customers.find(

          function(item) {

            return String(
              item.crf || ''
            )
            .trim()
            .toUpperCase()
            ===
            currentCRF;

          }

        );


      if (updated) {

        currentCustomer =
          updated;


        displayCustomer(
          updated
        );

      }

    }


    /*
     * RESULT
     */

    const failed =
      Array.isArray(
        result.failed
      )
        ? result.failed
        : [];


    const remainingCount =
      getPending().length;


    if (
      failed.length > 0
    ) {

      updateSyncInfo(

        remainingCount +
        ' pending • Will retry automatically'

      );


      showMessage(

        'saveMessage',

        'Some collections are still waiting to sync. They are safely saved on the phone.',

        false

      );

    } else {

      updateSyncInfo(

        remainingCount > 0

          ? remainingCount +
            ' pending • Waiting to sync'

          : '🟢 All data synchronized'

      );

    }


    console.log(
      'Synchronization completed.'
    );


  } catch (error) {

    console.error(
      'Synchronization error:',
      error
    );


    updateCounts();


    updateSyncInfo(
      'Sync failed • Retrying automatically'
    );


  } finally {

    syncInProgress =
      false;

  }

}


/********************************************************
 * MERGE SERVER PAYMENTS
 ********************************************************/

function mergeServerPayments(
  serverPayments,
  pendingTransactions
) {

  const merged = {};


  /*
   * 1. SERVER PAYMENTS
   */

  if (
    serverPayments &&
    typeof serverPayments === 'object'
  ) {

    const serverKeys =
      Object.keys(
        serverPayments
      );


    for (
      let i = 0;
      i < serverKeys.length;
      i++
    ) {

      const key =
        String(
          serverKeys[i]
        )
        .trim()
        .toUpperCase();


      const payment =
        serverPayments[
          serverKeys[i]
        ];


      if (!payment) {

        continue;

      }


      merged[key] = {

        lastPaymentDate:
          payment.lastPaymentDate || '',

        paidThrough:
          payment.paidThrough || ''

      };

    }

  }


  /*
   * 2. KEEP PENDING OFFLINE COLLECTIONS
   */

  const pending =
    Array.isArray(
      pendingTransactions
    )
      ? pendingTransactions
      : [];


  for (
    let i = 0;
    i < pending.length;
    i++
  ) {

    const transaction =
      pending[i];


    if (!transaction) {

      continue;

    }


    const crf =
      String(
        transaction.crf || ''
      )
      .trim()
      .toUpperCase();


    if (!crf) {

      continue;

    }


    if (!merged[crf]) {

      merged[crf] = {

        lastPaymentDate:
          '',

        paidThrough:
          ''

      };

    }


    /*
     * PENDING TRANSACTION DATE
     */

    const transactionDate =
      transaction.transactionDate
        ? new Date(
            transaction.transactionDate
          )
        : null;


    if (
      transactionDate &&
      !isNaN(
        transactionDate.getTime()
      )
    ) {

      const existingDate =
        merged[crf].lastPaymentDate
          ? new Date(
              merged[crf].lastPaymentDate
            )
          : null;


      if (
        !existingDate ||
        isNaN(
          existingDate.getTime()
        ) ||
        transactionDate >
        existingDate
      ) {

        merged[crf].lastPaymentDate =
          transactionDate.toISOString();

      }

    }


    /*
     * PENDING COVERED MONTH
     */

    const coveredDate =
      transaction.coveredDate
        ? new Date(
            transaction.coveredDate
          )
        : null;


    if (
      coveredDate &&
      !isNaN(
        coveredDate.getTime()
      )
    ) {

      const existingCovered =
        merged[crf].paidThrough
          ? new Date(
              merged[crf].paidThrough
            )
          : null;


      if (
        !existingCovered ||
        isNaN(
          existingCovered.getTime()
        ) ||
        coveredDate >
        existingCovered
      ) {

        merged[crf].paidThrough =
          coveredDate.toISOString();

      }

    }

  }


  /*
   * 3. SAVE
   */

  localStorage.setItem(

    PAYMENT_KEY,

    JSON.stringify(
      merged
    )

  );

}


/********************************************************
 * AUTOMATIC SYNC
 ********************************************************/

setInterval(

  function() {

    if (navigator.onLine) {

      syncNow();

    }

  },

  AUTO_SYNC_INTERVAL

);


/********************************************************
 * GET AGENT
 ********************************************************/

function getAgent() {

  try {

    const data =
      localStorage.getItem(
        AGENT_KEY
      );


    if (data) {

      const agent =
        JSON.parse(
          data
        );


      if (
        agent &&
        agent.agentId
      ) {

        return String(
          agent.agentId
        ).trim();

      }

    }

  } catch (error) {

    console.error(
      'getAgent error:',
      error
    );

  }


  return 'AG001';

}


/********************************************************
 * TRANSACTION ID
 ********************************************************/

function createTransactionId() {

  return (

    'COL-' +

    Date.now().toString(36) +

    '-' +

    Math.random()
      .toString(36)
      .substring(2, 10)

  );

}


/********************************************************
 * PAYMENT-FOR DATE
 ********************************************************/

function getPaymentForDate() {

  const input =
    document.getElementById(
      'paymentFor'
    );


  if (!input) {

    return null;

  }


  const value =
    input.value;


  if (!value) {

    return null;

  }


  const parts =
    value.split('-');


  if (
    parts.length !== 2
  ) {

    return null;

  }


  const year =
    Number(
      parts[0]
    );


  const month =
    Number(
      parts[1]
    );


  if (
    !year ||
    !month ||
    month < 1 ||
    month > 12
  ) {

    return null;

  }


  /*
   * First day of selected month.
   */

  return new Date(
    year,
    month - 1,
    1
  );

}


/********************************************************
 * FORMAT DATE
 ********************************************************/

function formatDate(date) {

  const d =
    new Date(
      date
    );


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return '-';

  }


  const months = [

    'JANUARY',

    'FEBRUARY',

    'MARCH',

    'APRIL',

    'MAY',

    'JUNE',

    'JULY',

    'AUGUST',

    'SEPTEMBER',

    'OCTOBER',

    'NOVEMBER',

    'DECEMBER'

  ];


  return (

    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    ) +

    ' ' +

    months[
      d.getMonth()
    ] +

    ' ' +

    d.getFullYear()

  );

}


/********************************************************
 * FORMAT PAID TILL
 ********************************************************/

function formatPaidTill(value) {

  if (!value) {

    return '';

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  const months = [

    'JANUARY',

    'FEBRUARY',

    'MARCH',

    'APRIL',

    'MAY',

    'JUNE',

    'JULY',

    'AUGUST',

    'SEPTEMBER',

    'OCTOBER',

    'NOVEMBER',

    'DECEMBER'

  ];


  return (

    months[
      date.getMonth()
    ] +

    ' ' +

    date.getFullYear()

  );

}


/********************************************************
 * DISPLAY DATE
 ********************************************************/

function formatDisplayDate(value) {

  if (!value) {

    return '';

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  return formatDate(
    date
  );

}


/********************************************************
 * MESSAGE
 ********************************************************/

function showMessage(
  id,
  message,
  success
) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message ' +
    (
      success
        ? 'success'
        : 'error'
    );


  element.innerText =
    message;

}


function hideMessage(id) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message';


  element.innerText =
    '';

}

 * ENTER KEY SUPPORT
 ********************************************************/

document
  .getElementById('crfSearch')
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter'
      ) {

        event.preventDefault();

        searchCustomer();

      }

    }
  );


/********************************************************
 * SAVE WITH ENTER FROM REMARKS
 ********************************************************/

document
  .getElementById('remarks')
  .addEventListener(
    'keydown',
    function(event) {

      /*
       * Ctrl + Enter saves.
       *
       * Normal Enter remains available
       * for remarks.
       */

      if (
        event.key === 'Enter' &&
        event.ctrlKey
      ) {

        event.preventDefault();

        saveCollection();

      }

    }
  );


</script>
