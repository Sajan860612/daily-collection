<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#166534">

<meta name="description"
      content="Daily Collection Management">

<title>Daily Collection</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.header {
  background: #166534;
  color: white;
  padding: 18px;
  text-align: center;
}

.header h2 {
  margin: 0 0 8px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
  background: white;
  color: #111827;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #166534;
  box-shadow: 0 0 0 2px rgba(22,101,52,.12);
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.99);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.search {
  background: #2563eb;
  color: white;
}

.save {
  background: #16a34a;
  color: white;
}

.info {
  background: #f0fdf4;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
}

.info-row {
  padding: 7px 0;
}

.label {
  font-weight: bold;
}

.online {
  color: #bbf7d0;
}

.offline {
  color: #fecaca;
}

.message {
  display: none;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.customer {
  display: none;
}

.pending {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  padding: 12px;
  border-radius: 8px;
  margin-top: 10px;
}

.payment-for-box {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  padding: 12px;
  border-radius: 8px;
  margin-top: 10px;
}

.payment-for-help {
  color: #1e40af;
  font-size: 13px;
  margin-top: 6px;
  line-height: 1.4;
}

.bottom-save {
  margin-top: 15px;
  margin-bottom: 0;
}

.sync-info {
  font-size: 13px;
  color: #374151;
  margin-top: 8px;
  text-align: center;
}

</style>

</head>


<body>


<header class="header">

<h2>
Daily Collection
</h2>

<div id="connectionStatus">
Checking connection...

</header>


<main class="container">


<!-- STATUS -->

<div class="card">

Customers on phone:

Data to update to sheet:

0
</strong>

</div>

  id="syncInfo"

Starting...

</div>

</div>


<!-- SEARCH -->

<div class="card">

<label>
CRF Number
</label>

<input
  id="crfSearch"
  type="text"
  placeholder="Enter CRF number"
  autocomplete="off"
>

<button
  id="searchButton"
  class="search"
  onclick="searchCustomer()">

🔍 Search Customer

</button>

<div
  id="searchMessage"
  class="message">
</div>

</div>


<!-- CUSTOMER -->

<div
  id="customerCard"
  class="card customer">


<!-- CUSTOMER INFORMATION -->

<div class="info">


<div class="info-row">

<span class="label">
Name:
</span>

<span id="customerName"></span>

</div>


<div class="info-row">

<span class="label">
CRF:
</span>

<span id="customerCRF"></span>

</div>


<div class="info-row">

<span class="label">
Address:
</span>

<span id="customerAddress"></span>

</div>


<div class="info-row">

<span class="label">
Phone:
</span>

<span id="customerPhone"></span>

</div>


<div class="info-row">

<span class="label">
Area:
</span>

<span id="customerArea"></span>

</div>

<span class="label">
Last Paid Date:
</span>

No previous payment

Payment For

<input

>

Select the month this collection is for.

The actual collection date and payment-for month

Remarks

  id="remarks"

</textarea>

  class="message">

<!-- SAVE -->

<button
  id="bottomSaveButton"
  class="save bottom-save"
  onclick="saveCollection()">

💰 Save Collection

</button>

</div>


</main>


<script>


/********************************************************
 * GOOGLE APPS SCRIPT WEB APP URL
 *
 * ======================================================
 * PASTE YOUR REAL WEB APP URL ONLY HERE.
 * ======================================================
 *
 * Example:
 *
 * const API_URL =
 *   'https://script.google.com/macros/s/ABC123/exec';
 *
 ********************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLLhoQmLtoMPQBpvraumj5nNGqtZGFLo9VbTC077SxH5AKWpow5aOaLUDMpdA7dlXJQQ/exec';


/********************************************************
 * SETTINGS
 ********************************************************/

const AUTO_SYNC_INTERVAL = 5000;

let syncInProgress = false;

let currentCustomer = null;


/********************************************************
 * LOCAL STORAGE KEYS
 ********************************************************/

const CUSTOMER_KEY =
  'dailyCollectionCustomers';

const PAYMENT_KEY =
  'dailyCollectionPayments';

const PENDING_KEY =
  'dailyCollectionPending';

const AGENT_KEY =
  'dailyCollectionAgent';


/********************************************************
 * START APPLICATION
 ********************************************************/

function startApplication() {

  console.log(
    'Daily Collection application started'
  );

  updateConnectionStatus();

  updateCounts();

  setDefaultPaymentFor();

  /*
   * Try synchronization immediately if online.
   */

  if (navigator.onLine) {

    syncNow();

  }

}


/********************************************************
 * START
 ********************************************************/

startApplication();


/********************************************************
 * ONLINE
 ********************************************************/

window.addEventListener(
  'online',
  function() {

    updateConnectionStatus();

    syncNow();

  }
);


/********************************************************
 * OFFLINE
 ********************************************************/

window.addEventListener(
  'offline',
  function() {

    updateConnectionStatus();

    updateSyncInfo(
      'Offline. Collections will be saved on this phone.'
    );

  }
);


/********************************************************
 * CONNECTION STATUS
 ********************************************************/

function updateConnectionStatus() {

  const element =
    document.getElementById(
      'connectionStatus'
    );

  if (!element) {

    return;

  }

  if (navigator.onLine) {

    element.innerText =
      '🟢 Online • Auto Sync ON';

    element.className =
      'online';

  } else {

    element.innerText =
      '🔴 Offline • Saved on phone';

    element.className =
      'offline';

  }

}


/********************************************************
 * SYNC INFO
 ********************************************************/

function updateSyncInfo(message) {

  const element =
    document.getElementById(
      'syncInfo'
    );

  if (element) {

    element.innerText =
      message;

  }

}


/********************************************************
 * LOCAL STORAGE - CUSTOMERS
 ********************************************************/

function getCustomers() {

  try {

    const data =
      localStorage.getItem(
        CUSTOMER_KEY
      );

    if (!data) {

      return [];

    }

    const customers =
      JSON.parse(data);

    return Array.isArray(customers)
      ? customers
      : [];

  } catch (error) {

    console.error(
      'getCustomers error:',
      error
    );

    return [];

  }

}


/********************************************************
 * LOCAL STORAGE - PAYMENTS
 ********************************************************/

function getPayments() {

  try {

    const data =
      localStorage.getItem(
        PAYMENT_KEY
      );

    if (!data) {

      return {};

    }

    const payments =
      JSON.parse(data);

    return payments &&
           typeof payments === 'object'
      ? payments
      : {};

  } catch (error) {

    console.error(
      'getPayments error:',
      error
    );

    return {};

  }

}


/********************************************************
 * LOCAL STORAGE - PENDING
 ********************************************************/

function getPending() {

  try {

    const data =
      localStorage.getItem(
        PENDING_KEY
      );

    if (!data) {

      return [];

    }

    const pending =
      JSON.parse(data);

    return Array.isArray(pending)
      ? pending
      : [];

  } catch (error) {

    console.error(
      'getPending error:',
      error
    );

    return [];

  }

}


/********************************************************
 * COUNTS
 ********************************************************/

function updateCounts() {

  const customerCount =
    document.getElementById(
      'customerCount'
    );

  const pendingCount =
    document.getElementById(
      'pendingCount'
    );


  if (customerCount) {

    customerCount.innerText =
      getCustomers().length;

  }


  if (pendingCount) {

    pendingCount.innerText =
      getPending().length;

  }

}


/********************************************************
 * DEFAULT PAYMENT MONTH
 ********************************************************/

function setDefaultPaymentFor() {

  const input =
    document.getElementById(
      'paymentFor'
    );

  if (!input) {

    return;

  }

  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    )
    .padStart(
      2,
      '0'
    );


  input.value =
    year + '-' + month;

}


/********************************************************
 * SEARCH CUSTOMER
 ********************************************************/

function searchCustomer() {

  const input =
    document.getElementById(
      'crfSearch'
    );


  if (!input) {

    return;

  }


let crf =
  input.value
    .trim()
    .toUpperCase();


setDefaultPaymentFor();



  if (!crf) {

    showMessage(
      'searchMessage',
      'Please enter a CRF number.',
      false
    );

    return;

  }


  /*
   * Convert short CRF to full CRF.
   *
   * 001    → CRF001
   * 01     → CRF01
   * 1      → CRF1
   * CRF001 → CRF001
   */

  if (!crf.startsWith('CRF')) {

    crf =
      'CRF' + crf;

  }


  const customers =
    getCustomers();


  const customer =
    customers.find(
      function(item) {

        const customerCRF =
          String(
            item.crf || ''
          )
          .trim()
          .toUpperCase();


        return customerCRF === crf;

      }
    );


  if (!customer) {

    document.getElementById(
      'customerCard'
    ).style.display =
      'none';


    showMessage(

      'searchMessage',

      'Customer ' +
      crf +
      ' not found on this phone. Please wait for synchronization to complete.',

      false

    );


    /*
     * Try synchronization once when
     * customer is not found.
     */

    if (navigator.onLine) {

      syncNow();

    }

    return;

  }


  currentCustomer =
    customer;


  /*
   * Show full CRF in the search box.
   *
   * Example:
   * 001 → CRF001
   */

  input.value =
    crf;


  hideMessage(
    'searchMessage'
  );


  displayCustomer(
    customer
  );

}

/********************************************************
 * DISPLAY CUSTOMER
 ********************************************************/

function displayCustomer(customer) {

  const card =
    document.getElementById(
      'customerCard'
    );


  if (!card) {

    return;

  }


  card.style.display =
    'block';


  document.getElementById(
    'customerName'
  ).innerText =
    customer.name || '';


  document.getElementById(
    'customerCRF'
  ).innerText =
    customer.crf || '';


  document.getElementById(
    'customerAddress'
  ).innerText =
    customer.address || '';


  document.getElementById(
    'customerPhone'
  ).innerText =
    customer.phone || '';


  document.getElementById(
    'customerArea'
  ).innerText =
    customer.area || '';


  /*
   * IMPORTANT:
   *
   * Local payment data is checked first.
   * This prevents the display from suddenly
   * changing to "No previous payment".
   */

  const payments =
    getPayments();


  const key =
    String(
      customer.crf || ''
    )
    .trim()
    .toUpperCase();


  const payment =
    payments[key];


  if (payment) {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      formatDisplayDate(
        payment.lastPaymentDate
      ) ||
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      formatPaidTill(
        payment.paidThrough
      ) ||
      '-';

  } else {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      '-';

  }

}


/********************************************************
 * SAVE COLLECTION
 ********************************************************/

function saveCollection() {

  if (!currentCustomer) {

    showMessage(

      'saveMessage',

      'Please search for a customer first.',

      false

    );

    return;

  }


  const paymentForDate =
    getPaymentForDate();


  if (!paymentForDate) {

    showMessage(

      'saveMessage',

      'Please select the month this collection is for.',

      false

    );

    return;

  }


  const remarksElement =
    document.getElementById(
      'remarks'
    );


  const remarks =
    remarksElement
      ? remarksElement.value.trim()
      : '';


  const transactionDate =
    new Date();


  /*
   * Get current pending transactions.
   */

  const pending =
    getPending();


  /*
   * Create a UNIQUE transaction ID.
   */

  const transactionId =
    createTransactionId();


  /*
   * Create transaction object.
   */

  const transaction = {

    transactionId:
      transactionId,

    transactionDate:
      transactionDate.toISOString(),

    coveredDate:
      paymentForDate.toISOString(),

crf:
  String(
    currentCustomer.crf || ''
  )
  .trim()
  .toUpperCase(),


    agent:
      getAgent(),

    remarks:
      remarks

  };


  /*
   * Add transaction to pending FIRST.
   */

  pending.push(
    transaction
  );


  /*
   * Save immediately to phone.
   *
   * Even if internet disappears,
   * this transaction will remain.
   */

  localStorage.setItem(

    PENDING_KEY,

    JSON.stringify(
      pending
    )

  );


  /*
   * Update local payment display immediately.
   */

  updateLocalPaymentSummary(

    currentCustomer.crf,

    transactionDate,

    paymentForDate

  );


  updateCounts();


  /*
   * Clear remarks only.
   */

  if (remarksElement) {

    remarksElement.value =
      '';

  }


  /*
   * Tell user what happened.
   */

  showMessage(

    'saveMessage',

    navigator.onLine

      ? 'Collection saved on phone. Synchronizing...'

      : 'Collection saved offline. It will synchronize when internet returns.',

    true

  );


  /*
   * Immediately synchronize.
   */

  if (navigator.onLine) {

    syncNow();

  }

}


/********************************************************
 * LOCAL PAYMENT SUMMARY
 ********************************************************/

function updateLocalPaymentSummary(
  crf,
  transactionDate,
  paymentForDate
) {

  const payments =
    getPayments();


  const key =
    String(
      crf
    )
    .trim()
    .toUpperCase();


  const existing =
    payments[key];


  /*
   * Keep the latest transaction date.
   */

  let lastPaymentDate =
    new Date(
      transactionDate
    );


  if (
    existing &&
    existing.lastPaymentDate
  ) {

    const existingTransactionDate =
      new Date(
        existing.lastPaymentDate
      );


    if (
      !isNaN(
        existingTransactionDate.getTime()
      ) &&
      existingTransactionDate >
      lastPaymentDate
    ) {

      lastPaymentDate =
        existingTransactionDate;

    }

  }


  /*
   * Keep the furthest payment month.
   */

  let paidThrough =
    new Date(
      paymentForDate
    );


  if (
    existing &&
    existing.paidThrough
  ) {

    const existingPaidThrough =
      new Date(
        existing.paidThrough
      );


    if (
      !isNaN(
        existingPaidThrough.getTime()
      ) &&
      existingPaidThrough >
      paidThrough
    ) {

      paidThrough =
        existingPaidThrough;

    }

  }


  payments[key] = {

    lastPaymentDate:
      lastPaymentDate.toISOString(),

    paidThrough:
      paidThrough.toISOString()

  };


  localStorage.setItem(

    PAYMENT_KEY,

    JSON.stringify(
      payments
    )

  );


  /*
   * Refresh currently displayed customer.
   */

  if (currentCustomer) {

    displayCustomer(
      currentCustomer
    );

  }

}


/********************************************************
 * SYNCHRONIZATION
 *
 * IMPORTANT:
 *
 * Pending transactions are NEVER deleted merely
 * because a request was sent.
 *
 * They are removed only when Apps Script returns
 * their transaction IDs inside syncedIds.
 ********************************************************/

async function syncNow() {

  if (!navigator.onLine) {

    updateSyncInfo(
      'Offline. Waiting for internet.'
    );

    return;

  }


  if (syncInProgress) {

    return;

  }


  /*
   * Check URL.
   */

  if (
    !API_URL ||
    API_URL.trim() === '' ||
    API_URL ===
      'PASTE_YOUR_WEB_APP_URL_HERE'
  ) {

    console.error(
      'API URL is not configured.'
    );


    updateSyncInfo(
      'Google Sheet URL is not configured.'
    );

    return;

  }


  syncInProgress =
    true;


  try {

    const pending =
      getPending();


    /*
     * Nothing to send.
     *
     * Still fetch customers/payment summary
     * from the server.
     */

    updateSyncInfo(
      pending.length > 0
        ? 'Synchronizing ' +
          pending.length +
          ' collection(s)...'
        : 'Checking collection data...'
    );


    console.log(
      'Pending before sync:',
      pending
    );


    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'sync',

              pending:
                pending,

              agent:
                getAgent()

            })

        }

      );


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      'Server response:',
      result
    );


    if (!result) {

      throw new Error(
        'Empty response from server.'
      );

    }


    /****************************************************
     * IMPORTANT
     *
     * Do NOT stop just because result.success
     * is false.
     *
     * Apps Script can successfully sync some
     * transactions while another one fails.
     ****************************************************/

    const syncedIds =
      new Set(

        Array.isArray(
          result.syncedIds
        )

          ? result.syncedIds

          : []

      );


    /*
     * Remove ONLY transactions confirmed by
     * the server.
     */

    if (
      syncedIds.size > 0
    ) {

      const remaining =
        pending.filter(

          function(item) {

            return !syncedIds.has(
              item.transactionId
            );

          }

        );


      localStorage.setItem(

        PENDING_KEY,

        JSON.stringify(
          remaining
        )

      );


      console.log(
        'Removed synced transactions:',
        syncedIds.size
      );

    }


    /****************************************************
     * SAVE CUSTOMERS
     *
     * Only replace customers when the server actually
     * returned a customer array.
     ****************************************************/

    if (
      Array.isArray(
        result.customers
      )
    ) {

      localStorage.setItem(

        CUSTOMER_KEY,

        JSON.stringify(
          result.customers
        )

      );

    }


    /****************************************************
     * SAVE SERVER PAYMENT SUMMARY
     *
     * IMPORTANT:
     *
     * Merge with local payments rather than blindly
     * replacing them.
     *
     * This prevents:
     *
     * Last Paid Date
     *        ↓
     * No previous payment
     *
     * after synchronization.
     ****************************************************/

/****************************************************
 * SAVE SERVER PAYMENT SUMMARY
 *
 * IMPORTANT:
 *
 * Always process result.payments, including when
 * Google Sheets has NO payments.
 *
 * This allows deleted collections to disappear
 * from the phone after synchronization.
 ****************************************************/

if (
  result.payments &&
  typeof result.payments === 'object'
) {

  mergeServerPayments(
    result.payments,
    getPending()
  );

} else {

  /*
   * If the server returned no payment summary,
   * use an empty object.
   *
   * Pending transactions are still preserved.
   */

  mergeServerPayments(
    {},
    getPending()
  );

}



    /****************************************************
     * UPDATE COUNTS
     ****************************************************/

    updateCounts();


    /****************************************************
     * REFRESH CURRENT CUSTOMER
     ****************************************************/

    if (currentCustomer) {

      const customers =
        getCustomers();


      const currentCRF =
        String(
          currentCustomer.crf || ''
        )
        .trim()
        .toUpperCase();


      const updated =
        customers.find(

          function(item) {

            return String(
              item.crf || ''
            )
            .trim()
            .toUpperCase()
            ===
            currentCRF;

          }

        );


      if (updated) {

        currentCustomer =
          updated;


        displayCustomer(
          updated
        );

      }

    }


    /****************************************************
     * HANDLE RESULT
     ****************************************************/

    const failed =
      Array.isArray(
        result.failed
      )
        ? result.failed
        : [];


    const remainingCount =
      getPending().length;


    if (
      failed.length > 0
    ) {

      updateSyncInfo(

        remainingCount +
        ' collection(s) waiting for retry.'

      );

      showMessage(

        'saveMessage',

        'Some collections could not be synchronized yet. They remain saved on the phone and will retry automatically.',

        false

      );

    } else {

      updateSyncInfo(
        remainingCount > 0
          ? remainingCount +
            ' collection(s) waiting to sync.'
          : 'All data synchronized.'
      );

    }


    console.log(
      'Synchronization completed.'
    );


  } catch (error) {

    console.error(
      'Synchronization error:',
      error
    );


    /*
     * DO NOT DELETE PENDING DATA.
     *
     * It remains in localStorage and will be
     * retried after 5 seconds.
     */

    updateCounts();


    updateSyncInfo(
      'Sync failed. Retrying automatically...'
    );


  } finally {

    syncInProgress =
      false;

  }

}


/********************************************************
 * MERGE SERVER PAYMENTS
 *
 * IMPORTANT:
 *
 * Server payment data is now the authoritative source.
 *
 * If the business owner deletes a collection from
 * the Google Sheet, that payment will disappear from
 * the phone after synchronization.
 *
 * However, collections still pending on the phone
 * are temporarily kept until they are synchronized.
 ********************************************************/

function mergeServerPayments(
  serverPayments,
  pendingTransactions
) {

  const merged = {};


  /******************************************************
   * 1. START WITH SERVER PAYMENTS
   *
   * Only payments currently existing in the
   * Google Sheet are loaded.
   ******************************************************/

  if (
    serverPayments &&
    typeof serverPayments === 'object'
  ) {

    const serverKeys =
      Object.keys(
        serverPayments
      );


    for (
      let i = 0;
      i < serverKeys.length;
      i++
    ) {

      const key =
        String(
          serverKeys[i]
        )
        .trim()
        .toUpperCase();


      const payment =
        serverPayments[
          serverKeys[i]
        ];


      if (!payment) {

        continue;

      }


      merged[key] = {

        lastPaymentDate:
          payment.lastPaymentDate || '',

        paidThrough:
          payment.paidThrough || ''

      };

    }

  }


  /******************************************************
   * 2. KEEP PENDING OFFLINE COLLECTIONS
   *
   * These collections are not yet in Google Sheets.
   * Therefore they must remain visible on the phone
   * until synchronization succeeds.
   ******************************************************/

  const pending =
    Array.isArray(
      pendingTransactions
    )
      ? pendingTransactions
      : [];


  for (
    let i = 0;
    i < pending.length;
    i++
  ) {

    const transaction =
      pending[i];


    if (!transaction) {

      continue;

    }


    const crf =
      String(
        transaction.crf || ''
      )
      .trim()
      .toUpperCase();


    if (!crf) {

      continue;

    }


    if (!merged[crf]) {

      merged[crf] = {

        lastPaymentDate:
          '',

        paidThrough:
          ''

      };

    }


    /****************************************************
     * PENDING TRANSACTION DATE
     ****************************************************/

    const transactionDate =
      transaction.transactionDate
        ? new Date(
            transaction.transactionDate
          )
        : null;


    if (
      transactionDate &&
      !isNaN(
        transactionDate.getTime()
      )
    ) {

      const existingDate =
        merged[crf].lastPaymentDate
          ? new Date(
              merged[crf].lastPaymentDate
            )
          : null;


      if (
        !existingDate ||
        isNaN(
          existingDate.getTime()
        ) ||
        transactionDate >
        existingDate
      ) {

        merged[crf].lastPaymentDate =
          transactionDate.toISOString();

      }

    }


    /****************************************************
     * PENDING COVERED MONTH
     ****************************************************/

    const coveredDate =
      transaction.coveredDate
        ? new Date(
            transaction.coveredDate
          )
        : null;


    if (
      coveredDate &&
      !isNaN(
        coveredDate.getTime()
      )
    ) {

      const existingCovered =
        merged[crf].paidThrough
          ? new Date(
              merged[crf].paidThrough
            )
          : null;


      if (
        !existingCovered ||
        isNaN(
          existingCovered.getTime()
        ) ||
        coveredDate >
        existingCovered
      ) {

        merged[crf].paidThrough =
          coveredDate.toISOString();

      }

    }

  }


  /******************************************************
   * 3. SAVE NEW PAYMENT SUMMARY
   ******************************************************/

  localStorage.setItem(

    PAYMENT_KEY,

    JSON.stringify(
      merged
    )

  );

}
/********************************************************
 * AUTOMATIC SYNC
 ********************************************************/

setInterval(

  function() {

    if (navigator.onLine) {

      syncNow();

    }

  },

  AUTO_SYNC_INTERVAL

);


/********************************************************
 * GET AGENT
 ********************************************************/

function getAgent() {

  try {

    const data =
      localStorage.getItem(
        AGENT_KEY
      );


    if (data) {

      const agent =
        JSON.parse(
          data
        );


      if (
        agent &&
        agent.agentId
      ) {

        return String(
          agent.agentId
        ).trim();

      }

    }

  } catch (error) {

    console.error(
      'getAgent error:',
      error
    );

  }


  /*
   * Default agent.
   */

  return 'AG001';

}


/********************************************************
 * TRANSACTION ID
 ********************************************************/

function createTransactionId() {

  return (

    'COL-' +

    Date.now().toString(36) +

    '-' +

    Math.random()
      .toString(36)
      .substring(2, 10)

  );

}


/********************************************************
 * PAYMENT-FOR DATE
 ********************************************************/

function getPaymentForDate() {

  const input =
    document.getElementById(
      'paymentFor'
    );


  if (!input) {

    return null;

  }


  const value =
    input.value;


  if (!value) {

    return null;

  }


  const parts =
    value.split('-');


  if (
    parts.length !== 2
  ) {

    return null;

  }


  const year =
    Number(
      parts[0]
    );


  const month =
    Number(
      parts[1]
    );


  if (
    !year ||
    !month ||
    month < 1 ||
    month > 12
  ) {

    return null;

  }


  /*
   * Use the first day of the selected month.
   *
   * This is what the Apps Script backend expects
   * for Covered Date.
   */

  return new Date(
    year,
    month - 1,
    1
  );

}


/********************************************************
 * FORMAT DATE
 ********************************************************/

function formatDate(date) {

  const d =
    new Date(
      date
    );


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return '-';

  }


  const months = [

    'JANUARY',

    'FEBRUARY',

    'MARCH',

    'APRIL',

    'MAY',

    'JUNE',

    'JULY',

    'AUGUST',

    'SEPTEMBER',

    'OCTOBER',

    'NOVEMBER',

    'DECEMBER'

  ];


  return (

    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    ) +

    ' ' +

    months[
      d.getMonth()
    ] +

    ' ' +

    d.getFullYear()

  );

}


/********************************************************
 * FORMAT PAID TILL
 ********************************************************/

function formatPaidTill(value) {

  if (!value) {

    return '';

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  const months = [

    'JANUARY',

    'FEBRUARY',

    'MARCH',

    'APRIL',

    'MAY',

    'JUNE',

    'JULY',

    'AUGUST',

    'SEPTEMBER',

    'OCTOBER',

    'NOVEMBER',

    'DECEMBER'

  ];


  return (

    months[
      date.getMonth()
    ] +

    ' ' +

    date.getFullYear()

  );

}


/********************************************************
 * DISPLAY DATE
 ********************************************************/

function formatDisplayDate(value) {

  if (!value) {

    return '';

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  return formatDate(
    date
  );

}


/********************************************************
 * MESSAGE
 ********************************************************/

function showMessage(
  id,
  message,
  success
) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message ' +
    (
      success
        ? 'success'
        : 'error'
    );


  element.innerText =
    message;

}


function hideMessage(id) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message';


  element.innerText =
    '';

}
