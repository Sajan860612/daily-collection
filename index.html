<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#166534">

<meta name="description"
      content="Daily Collection Management">

<title>Daily Collection</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.header {
  background: #166534;
  color: white;
  padding: 18px;
  text-align: center;
}

.header h2 {
  margin: 0 0 8px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
  background: white;
  color: #111827;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #166534;
  box-shadow: 0 0 0 2px rgba(22,101,52,.12);
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.99);
}

.search {
  background: #2563eb;
  color: white;
}

.save {
  background: #16a34a;
  color: white;
}

.info {
  background: #f0fdf4;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
}

.info-row {
  padding: 7px 0;
}

.label {
  font-weight: bold;
}

.online {
  color: #bbf7d0;
}

.offline {
  color: #fecaca;
}

.message {
  display: none;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  line-height: 1.4;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.customer {
  display: none;
}

.pending {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  padding: 12px;
  border-radius: 8px;
  margin-top: 10px;
}

.payment-for-box {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  padding: 12px;
  border-radius: 8px;
  margin-top: 10px;
}

.payment-for-help {
  color: #1e40af;
  font-size: 13px;
  margin-top: 6px;
  line-height: 1.4;
}

.bottom-save {
  margin-top: 15px;
  margin-bottom: 0;
}

</style>

</head>

<body>

<header class="header">

<h2>
Daily Collection
</h2>

<div id="connectionStatus">
Checking connection...
</div>

</header>


<main class="container">


<!-- STATUS -->

<div class="card">

<strong>
Customers on phone:
</strong>

<span id="customerCount">
0
</span>


<div class="pending">

Data to update to sheet:

<strong id="pendingCount">
0
</strong>

</div>

</div>


<!-- SEARCH -->

<div class="card">

<label>
CRF Number
</label>

<input
  id="crfSearch"
  type="text"
  placeholder="Enter CRF number"
  autocomplete="off"
>

<button
  class="search"
  onclick="searchCustomer()">

🔍 Search Customer

</button>

     class="message">
</div>

</div>


<!-- CUSTOMER -->

<div id="customerCard"
     class="card customer">


<!-- CUSTOMER INFORMATION -->

<div class="info">


<div class="info-row">

<span class="label">
Name:
</span>

<span id="customerName"></span>

</div>


<div class="info-row">

<span class="label">
CRF:
</span>

<span id="customerCRF"></span>

</div>

<span class="label">
Address:
</span>

<span id="customerAddress"></span>

</div>


<div class="info-row">

<span class="label">
Phone:
</span>

<span id="customerPhone"></span>

</div>


<div class="info-row">

<span class="label">
Area:
</span>

<span id="customerArea"></span>

-

Payment For

Remarks

  id="remarks"

</textarea>

     class="message">

<!-- SAVE -->

  id="bottomSaveButton"
  class="save bottom-save"
  onclick="saveCollection()">

💰 Save Collection

</button>

</main>


<script>

/********************************************************
 * GOOGLE APPS SCRIPT URL
 *
 * IMPORTANT:
 * Replace the text below with your REAL deployed
 * Google Apps Script Web App URL.
 ********************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLLhoQmLtoMPQBpvraumj5nNGqtZGFLo9VbTC077SxH5AKWpow5aOaLUDMpdA7dlXJQQ/exec';


/********************************************************
 * SETTINGS
 ********************************************************/

const AUTO_SYNC_INTERVAL = 5000;

let syncInProgress = false;

let currentCustomer = null;


/********************************************************
 * LOCAL STORAGE KEYS
 ********************************************************/

const CUSTOMER_KEY =
  'dailyCollectionCustomers';

const PAYMENT_KEY =
  'dailyCollectionPayments';

const PENDING_KEY =
  'dailyCollectionPending';

const AGENT_KEY =
  'dailyCollectionAgent';


/********************************************************
 * START APPLICATION
 ********************************************************/

function startApplication() {

  console.log(
    'Daily Collection application started'
  );

  updateConnectionStatus();

  updateCounts();

  setDefaultPaymentFor();


  if (navigator.onLine) {

    syncNow();

  }

}


startApplication();


/********************************************************
 * ONLINE / OFFLINE
 ********************************************************/

window.addEventListener(
  'online',
  function() {

    updateConnectionStatus();

    syncNow();

  }
);


window.addEventListener(
  'offline',
  function() {

    updateConnectionStatus();

  }
);


/********************************************************
 * CONNECTION STATUS
 ********************************************************/

function updateConnectionStatus() {

  const element =
    document.getElementById(
      'connectionStatus'
    );

  if (!element) {
    return;
  }


  if (navigator.onLine) {

    element.innerText =
      '🟢 Online • Auto Sync ON';

    element.className =
      'online';

  } else {

    element.innerText =
      '🔴 Offline • Saved on phone';

    element.className =
      'offline';

  }

}


/********************************************************
 * LOCAL STORAGE
 ********************************************************/

function getCustomers() {

  try {

    return JSON.parse(

      localStorage.getItem(
        CUSTOMER_KEY
      ) || '[]'

    );

  } catch (error) {

    console.error(
      error
    );

    return [];

  }

}


function getPayments() {

  try {

    return JSON.parse(

      localStorage.getItem(
        PAYMENT_KEY
      ) || '{}'

    );

  } catch (error) {

    console.error(
      error
    );

    return {};

  }

}


function getPending() {

  try {

    return JSON.parse(

      localStorage.getItem(
        PENDING_KEY
      ) || '[]'

    );

  } catch (error) {

    console.error(
      error
    );

    return [];

  }

}


/********************************************************
 * COUNTS
 ********************************************************/

function updateCounts() {

  const customerCount =
    document.getElementById(
      'customerCount'
    );

  const pendingCount =
    document.getElementById(
      'pendingCount'
    );


  if (customerCount) {

    customerCount.innerText =
      getCustomers().length;

  }


  if (pendingCount) {

    pendingCount.innerText =
      getPending().length;

  }

}


/********************************************************
 * DEFAULT PAYMENT MONTH
 ********************************************************/

function setDefaultPaymentFor() {

  const input =
    document.getElementById(
      'paymentFor'
    );


  if (!input) {
    return;
  }


  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  input.value =
    year + '-' + month;

}


/********************************************************
 * SEARCH CUSTOMER
 ********************************************************/

function searchCustomer() {

  const input =
    document.getElementById(
      'crfSearch'
    );


  const crf =
    input.value
      .trim()
      .toUpperCase();


  if (!crf) {

    showMessage(
      'searchMessage',
      'Please enter a CRF number.',
      false
    );

    return;

  }


  const customers =
    getCustomers();


  const customer =
    customers.find(
      function(item) {

        return String(
          item.crf || ''
        )
        .trim()
        .toUpperCase()
        === crf;

      }
    );


  if (!customer) {

    document.getElementById(
      'customerCard'
    ).style.display =
      'none';


    showMessage(

      'searchMessage',

      'Customer not found on this phone. Please wait for synchronization to complete.',

      false

    );


    /*
     * Try synchronization immediately.
     */

    if (navigator.onLine) {
      syncNow();
    }


    return;

  }


  currentCustomer =
    customer;


  hideMessage(
    'searchMessage'
  );


  displayCustomer(
    customer
  );

}


/********************************************************
 * DISPLAY CUSTOMER
 ********************************************************/

function displayCustomer(customer) {

  document.getElementById(
    'customerCard'
  ).style.display =
    'block';


  document.getElementById(
    'customerName'
  ).innerText =
    customer.name || '';


  document.getElementById(
    'customerCRF'
  ).innerText =
    customer.crf || '';


  document.getElementById(
    'customerAddress'
  ).innerText =
    customer.address || '';


  document.getElementById(
    'customerPhone'
  ).innerText =
    customer.phone || '';


  document.getElementById(
    'customerArea'
  ).innerText =
    customer.area || '';


  const payments =
    getPayments();


  const key =
    String(
      customer.crf || ''
    )
    .trim()
    .toUpperCase();


  const payment =
    payments[key];


  if (payment) {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      formatDisplayDate(
        payment.lastPaymentDate
      ) ||
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      formatPaidTill(
        payment.paidThrough
      ) ||
      '-';

  } else {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      '-';

  }

}


/********************************************************
 * SAVE COLLECTION
 ********************************************************/

function saveCollection() {

  if (!currentCustomer) {

    showMessage(

      'saveMessage',

      'Please search for a customer first.',

      false

    );

    return;

  }


  const paymentForDate =
    getPaymentForDate();


  if (!paymentForDate) {

    showMessage(

      'saveMessage',

      'Please select the month this collection is for.',

      false

    );

    return;

  }


  const remarks =
    document.getElementById(
      'remarks'
    )
    .value
    .trim();


  const transactionDate =
    new Date();


  const transaction = {

    transactionId:
      createTransactionId(),


    transactionDate:
      transactionDate.toISOString(),


    /*
     * IMPORTANT:
     *
     * Send Payment For as a simple YYYY-MM-01
     * string so timezone conversion cannot move
     * it into the previous month.
     */

    coveredDate:
      paymentForDate.getFullYear() +
      '-' +
      String(
        paymentForDate.getMonth() + 1
      ).padStart(
        2,
        '0'
      ) +
      '-01',


    crf:
      currentCustomer.crf,


    agent:
      getAgent(),


    remarks:
      remarks

  };


  console.log(
    'NEW TRANSACTION:',
    transaction
  );


  const pending =
    getPending();


  pending.push(
    transaction
  );


  localStorage.setItem(

    PENDING_KEY,

    JSON.stringify(
      pending
    )

  );


  /*
   * Show payment immediately on phone.
   */

  updateLocalPaymentSummary(

    currentCustomer.crf,

    transactionDate,

    paymentForDate

  );


  updateCounts();


  clearForm();


  showMessage(

    'saveMessage',

    navigator.onLine

      ? 'Collection saved on phone. Synchronizing...'

      : 'Collection saved offline. It will synchronize when internet returns.',

    true

  );


  /*
   * Immediately synchronize.
   */

  if (navigator.onLine) {

    syncNow();

  }

}


/********************************************************
 * LOCAL PAYMENT SUMMARY
 ********************************************************/

function updateLocalPaymentSummary(
  crf,
  transactionDate,
  paymentForDate
) {

  const payments =
    getPayments();


  const key =
    String(crf)
      .trim()
      .toUpperCase();


  const existing =
    payments[key];


  let paidThrough =
    new Date(
      paymentForDate
    );


  if (
    existing &&
    existing.paidThrough
  ) {

    const existingDate =
      new Date(
        existing.paidThrough
      );


    if (
      !isNaN(
        existingDate.getTime()
      ) &&
      existingDate > paidThrough
    ) {

      paidThrough =
        existingDate;

    }

  }


  payments[key] = {

    lastPaymentDate:
      transactionDate.toISOString(),


    paidThrough:
      paidThrough.toISOString()

  };


  localStorage.setItem(

    PAYMENT_KEY,

    JSON.stringify(
      payments
    )

  );


  if (currentCustomer) {

    displayCustomer(
      currentCustomer
    );

  }

}


/********************************************************
 * SYNCHRONIZATION
 *
 * ONLY ONE syncNow() FUNCTION IN THIS HTML.
 ********************************************************/

async function syncNow() {

  if (!navigator.onLine) {

    console.log(
      'Sync skipped: device is offline.'
    );

    return;

  }


  if (syncInProgress) {

    console.log(
      'Sync skipped: another sync is running.'
    );

    return;

  }


  if (
    !API_URL ||
    API_URL.trim() === '' ||
    API_URL === 'PASTE_YOUR_WEB_APP_URL_HERE' ||
    API_URL === 'paste the url here'
  ) {

    console.error(
      'API URL is not configured.'
    );

    return;

  }


  syncInProgress =
    true;


  try {

    const pending =
      getPending();


    const agent =
      getAgent();


    console.log(
      'SYNC START',
      {
        pending: pending,
        agent: agent
      }
    );


    /*
     * Send even when pending is empty.
     *
     * This downloads customers and payment
     * information from Google Sheets.
     */

    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',


          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },


          body:
            JSON.stringify({

              action:
                'sync',

              pending:
                pending,

              agent:
                agent

            })

        }

      );


    console.log(
      'HTTP status:',
      response.status
    );


    if (!response.ok) {

      throw new Error(
        'Google Apps Script HTTP error: ' +
        response.status
      );

    }


    const responseText =
      await response.text();


    console.log(
      'SERVER RESPONSE:',
      responseText
    );


    if (!responseText) {

      throw new Error(
        'Google Apps Script returned an empty response.'
      );

    }


    let result;


    try {

      result =
        JSON.parse(
          responseText
        );

    } catch (error) {

      throw new Error(
        'Invalid response from Google Apps Script.'
      );

    }


    console.log(
      'SYNC RESULT:',
      result
    );


    /******************************************************
     * ALWAYS UPDATE CUSTOMERS FROM SERVER
     ******************************************************/

    if (
      Array.isArray(
        result.customers
      )
    ) {

      localStorage.setItem(

        CUSTOMER_KEY,

        JSON.stringify(
          result.customers
        )

      );


      console.log(
        'Customers downloaded:',
        result.customers.length
      );

    }


    /******************************************************
     * ONLY UPDATE SERVER PAYMENT SUMMARY WHEN THERE
     * ARE NO LOCAL PENDING TRANSACTIONS OR WHEN THE
     * SERVER HAS SUCCESSFULLY ACCEPTED THEM.
     ******************************************************/

    const syncedIds =
      new Set(

        Array.isArray(
          result.syncedIds
        )

          ? result.syncedIds

          : []

      );


    const remaining =
      pending.filter(

        function(item) {

          return !syncedIds.has(
            item.transactionId
          );

        }

      );


    /*
     * Save remaining pending transactions.
     */

    localStorage.setItem(

      PENDING_KEY,

      JSON.stringify(
        remaining
      )

    );


    updateCounts();


    /******************************************************
     * PAYMENT SUMMARY
     *
     * If there are still pending transactions, merge
     * server data with local pending data instead of
     * allowing the old server data to erase the
     * newly-entered payment.
     ******************************************************/

    if (
      result.payments &&
      typeof result.payments === 'object'
    ) {

      const serverPayments =
        result.payments;


      const localPayments =
        getPayments();


      /*
       * Start with server data.
       */

      const mergedPayments =
        Object.assign(
          {},
          serverPayments
        );


      /*
       * Preserve local pending payments.
       */

      for (
        let i = 0;
        i < remaining.length;
        i++
      ) {

        const item =
          remaining[i];


        const key =
          String(
            item.crf || ''
          )
          .trim()
          .toUpperCase();


        if (!key) {
          continue;
        }


        const local =
          localPayments[key];


        if (!local) {
          continue;
        }


        const server =
          mergedPayments[key];


        if (!server) {

          mergedPayments[key] =
            local;

          continue;

        }


        const localTransactionDate =
          new Date(
            local.lastPaymentDate
          );


        const serverTransactionDate =
          new Date(
            server.lastPaymentDate
          );


        if (
          !isNaN(
            localTransactionDate.getTime()
          )
          &&
          (
            isNaN(
              serverTransactionDate.getTime()
            )
            ||
            localTransactionDate >
            serverTransactionDate
          )
        ) {

          server.lastPaymentDate =
            local.lastPaymentDate;

        }


        const localPaidThrough =
          new Date(
            local.paidThrough
          );


        const serverPaidThrough =
          new Date(
            server.paidThrough
          );


        if (
          !isNaN(
            localPaidThrough.getTime()
          )
          &&
          (
            isNaN(
              serverPaidThrough.getTime()
            )
            ||
            localPaidThrough >
            serverPaidThrough
          )
        ) {

          server.paidThrough =
            local.paidThrough;

        }

      }


      localStorage.setItem(

        PAYMENT_KEY,

        JSON.stringify(
          mergedPayments
        )

      );

    }


    /******************************************************
     * REFRESH CURRENT CUSTOMER
     ******************************************************/

    if (currentCustomer) {

      const customers =
        getCustomers();


      const updated =
        customers.find(

          function(item) {

            return String(
              item.crf || ''
            )
            .trim()
            .toUpperCase()
            ===
            String(
              currentCustomer.crf || ''
            )
            .trim()
            .toUpperCase();

          }

        );


      if (updated) {

        currentCustomer =
          updated;


        displayCustomer(
          updated
        );

      }

    }


    /******************************************************
     * SERVER REPORTED FAILURE
     ******************************************************/

    if (!result.success) {

      let message =
        result.message ||
        'Some data could not be synchronized.';


      if (
        Array.isArray(
          result.failed
        ) &&
        result.failed.length > 0
      ) {

        const firstFailure =
          result.failed[0];


        message =
          'Sync failed: ' +
          (
            firstFailure.message ||
            message
          );

      }


      console.error(
        'SERVER SYNC FAILURE:',
        result
      );


      showMessage(

        'saveMessage',

        message,

        false

      );


      return;

    }


    /******************************************************
     * SUCCESS
     ******************************************************/

    if (remaining.length === 0) {

      showMessage(

        'saveMessage',

        'Collection synchronized successfully.',

        true

      );

    } else {

      showMessage(

        'saveMessage',

        remaining.length +
        ' collection(s) still waiting to synchronize.',

        false

      );

    }


    console.log(
      'Synchronization completed.'
    );


  } catch (error) {

    console.error(
      'SYNCHRONIZATION ERROR:',
      error
    );


    /*
     * DO NOT DELETE PENDING DATA.
     */

    showMessage(

      'saveMessage',

      'Synchronization failed. ' +
      'Collection is still saved on this phone. ' +
      (
        error.message ||
        String(error)
      ),

      false

    );

  } finally {

    syncInProgress =
      false;

  }

}


/********************************************************
 * AUTOMATIC SYNC
 ********************************************************/

setInterval(

  function() {

    if (navigator.onLine) {

      syncNow();

    }

  },

  AUTO_SYNC_INTERVAL

);


/********************************************************
 * GET AGENT
 ********************************************************/

function getAgent() {

  try {

    const agent =
      JSON.parse(

        localStorage.getItem(
          AGENT_KEY
        ) || 'null'

      );


    if (
      agent &&
      agent.agentId
    ) {

      return agent.agentId;

    }

  } catch (error) {

    console.error(
      error
    );

  }


  return 'AG001';

}


/********************************************************
 * TRANSACTION ID
 ********************************************************/

function createTransactionId() {

  return (

    'COL-' +

    Date.now().toString(36) +

    '-' +

    Math.random()
      .toString(36)
      .substring(2, 10)

  );

}


/********************************************************
 * PAYMENT-FOR DATE
 ********************************************************/

function getPaymentForDate() {

  const input =
    document.getElementById(
      'paymentFor'
    );


  if (!input) {

    return null;

  }


  const value =
    input.value;


  if (!value) {

    return null;

  }


  const parts =
    value.split('-');


  if (
    parts.length !== 2
  ) {

    return null;

  }


  const year =
    Number(
      parts[0]
    );


  const month =
    Number(
      parts[1]
    );


  if (
    !year ||
    !month ||
    month < 1 ||
    month > 12
  ) {

    return null;

  }


  /*
   * Noon prevents accidental timezone rollover.
   */

  return new Date(

    year,

    month - 1,

    1,

    12,

    0,

    0

  );

}


/********************************************************
 * FORMAT DATE
 ********************************************************/

function formatDate(date) {

  const d =
    new Date(date);


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return '-';

  }


  const months = [

    'JANUARY',
    'FEBRUARY',
    'MARCH',
    'APRIL',
    'MAY',
    'JUNE',
    'JULY',
    'AUGUST',
    'SEPTEMBER',
    'OCTOBER',
    'NOVEMBER',
    'DECEMBER'

  ];


  return (

    String(
      d.getDate()
    ).padStart(2, '0') +

    ' ' +

    months[
      d.getMonth()
    ] +

    ' ' +

    d.getFullYear()

  );

}


/********************************************************
 * FORMAT PAID TILL
 ********************************************************/

function formatPaidTill(value) {

  if (!value) {

    return '';

  }


  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  const months = [

    'JANUARY',
    'FEBRUARY',
    'MARCH',
    'APRIL',
    'MAY',
    'JUNE',
    'JULY',
    'AUGUST',
    'SEPTEMBER',
    'OCTOBER',
    'NOVEMBER',
    'DECEMBER'

  ];


  return (

    months[
      date.getMonth()
    ] +

    ' ' +

    date.getFullYear()

  );

}


/********************************************************
 * DISPLAY DATE
 ********************************************************/

function formatDisplayDate(value) {

  if (!value) {

    return '';

  }


  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  return formatDate(
    date
  );

}


/********************************************************
 * CLEAR FORM
 ********************************************************/

function clearForm() {

  document.getElementById(
    'remarks'
  ).value =
    '';


  setDefaultPaymentFor();

}


/********************************************************
 * MESSAGE
 ********************************************************/

function showMessage(
  id,
  message,
  success
) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message ' +
    (
      success
        ? 'success'
        : 'error'
    );


  element.innerText =
    message;

}


function hideMessage(id) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message';


  element.innerText =
    '';

}
