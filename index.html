<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#166534"
  >

  <meta
    name="description"
    content="Daily Collection Management"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Daily Collection</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #166534;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h2 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      background: white;
      color: #111827;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #166534;
      box-shadow: 0 0 0 2px rgba(22,101,52,.12);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.99);
    }

    .search {
      background: #2563eb;
      color: white;
    }

    .save {
      background: #16a34a;
      color: white;
    }

    .sync {
      background: #7c3aed;
      color: white;
    }

    .info {
      background: #f0fdf4;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .info-row {
      padding: 7px 0;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    .online {
      color: #bbf7d0;
    }

    .offline {
      color: #fecaca;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      line-height: 1.4;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .customer {
      display: none;
    }

    .pending {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .payment-for-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .payment-for-help {
      color: #1e40af;
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .sync-status {
      font-size: 13px;
      margin-top: 8px;
      color: #166534;
      line-height: 1.4;
    }

    .top-save {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .loading {
      opacity: .7;
    }

  </style>

</head>


<body>


<header class="header">

  <h2>
    Daily Collection
  </h2>

  <div id="connectionStatus">
    Checking connection...
  </div>

</header>


<main class="container">


  <!-- STATUS -->

  <div class="card">

    <strong>
      Customers on phone:
    </strong>

    <span id="customerCount">
      0
    </span>


    <div class="pending">

      Pending collections:

      <strong id="pendingCount">
        0
      </strong>

    </div>


    <div
      id="syncStatus"
      class="sync-status"
    >
      Starting application...
    </div>


    <button
      id="syncButton"
      class="sync"
      onclick="syncNow(true)"
    >
      🔄 Sync Customers
    </button>

  </div>


  <!-- SAVE -->

  <button
    id="topSaveButton"
    class="save top-save"
    onclick="saveCollection()"
  >
    💰 Save Collection
  </button>


  <!-- SEARCH -->

  <div class="card">

    <label>
      CRF Number
    </label>


    <input
      id="crfSearch"
      type="text"
      placeholder="Enter CRF number"
      autocomplete="off"
      autocapitalize="characters"
    >


    <button
      class="search"
      onclick="searchCustomer()"
    >
      🔍 Search Customer
    </button>


    <div
      id="searchMessage"
      class="message"
    ></div>

  </div>


  <!-- CUSTOMER -->

  <div
    id="customerCard"
    class="card customer"
  >

    <h3 id="customerName"></h3>


    <div class="info">


      <div class="info-row">

        <span class="label">
          CRF:
        </span>

        <span id="customerCRF"></span>

      </div>


      <div class="info-row">

        <span class="label">
          Address:
        </span>

        <span id="customerAddress"></span>

      </div>


      <div class="info-row">

        <span class="label">
          Phone:
        </span>

        <span id="customerPhone"></span>

      </div>


      <div class="info-row">

        <span class="label">
          Area:
        </span>

        <span id="customerArea"></span>

      </div>


      <div class="info-row">

        <span class="label">
          Last Paid Date:
        </span>

        <span id="lastPaidDate">
          No previous payment
        </span>

      </div>


      <div class="info-row">

        <span class="label">
          PAID TILL:
        </span>

        <span id="paidThrough">
          -
        </span>

      </div>


    </div>


    <!-- PAYMENT FOR -->

    <div class="payment-for-box">

      <label style="margin-top: 0;">
        Payment For
      </label>


      <input
        id="paymentFor"
        type="month"
      >


      <div class="payment-for-help">

        Select the month this collection is for.

        <br>

        The collection date and payment-for month
        are stored separately.

      </div>

    </div>


    <!-- REMARKS -->

    <label>
      Remarks
    </label>


    <textarea
      id="remarks"
      placeholder="Optional"
    ></textarea>


    <div
      id="saveMessage"
      class="message"
    ></div>

  </div>


</main>


<script>

/************************************************************
 * GOOGLE APPS SCRIPT WEB APP URL
 *
 * REPLACE THIS WITH YOUR REAL /exec URL.
 ************************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLLhoQmLtoMPQBpvraumj5nNGqtZGFLo9VbTC077SxH5AKWpow5aOaLUDMpdA7dlXJQQ/exec';


/************************************************************
 * SETTINGS
 ************************************************************/

const AUTO_SYNC_INTERVAL = 10000;

let syncInProgress = false;

let currentCustomer = null;


/************************************************************
 * LOCAL STORAGE KEYS
 ************************************************************/

const CUSTOMER_KEY =
  'dailyCollectionCustomers';

const PAYMENT_KEY =
  'dailyCollectionPayments';

const PENDING_KEY =
  'dailyCollectionPending';

const AGENT_KEY =
  'dailyCollectionAgent';


/************************************************************
 * START APPLICATION
 ************************************************************/

function startApplication() {

  console.log(
    'Daily Collection JavaScript started.'
  );


  updateConnectionStatus();

  updateCounts();

  setDefaultPaymentFor();


  document.getElementById(
    'syncStatus'
  ).innerText =
    'Connecting to server...';


  /*
   * IMPORTANT:
   *
   * We deliberately do NOT register the service worker
   * in this version.
   *
   * This prevents an old service worker from serving
   * your old Collection Entry / Amount / Payment Type
   * page.
   */


  /*
   * Download customers immediately.
   *
   * This happens even when there are zero pending
   * collections.
   */

  if (navigator.onLine) {

    syncNow(false);

  } else {

    document.getElementById(
      'syncStatus'
    ).innerText =
      'Offline. Using customers saved on phone.';

  }


  setInterval(function() {

    if (navigator.onLine) {

      syncNow(false);

    }

  }, AUTO_SYNC_INTERVAL);

}


/************************************************************
 * ONLINE / OFFLINE
 ************************************************************/

window.addEventListener(
  'online',
  function() {

    updateConnectionStatus();

    syncNow(false);

  }
);


window.addEventListener(
  'offline',
  function() {

    updateConnectionStatus();

  }
);


/************************************************************
 * CONNECTION STATUS
 ************************************************************/

function updateConnectionStatus() {

  const element =
    document.getElementById(
      'connectionStatus'
    );


  if (!element) {

    return;

  }


  if (navigator.onLine) {

    element.innerText =
      '🟢 Online • Auto Sync ON';

    element.className =
      'online';

  } else {

    element.innerText =
      '🔴 Offline • Saved on phone';

    element.className =
      'offline';

  }

}


/************************************************************
 * LOCAL STORAGE
 ************************************************************/

function getCustomers() {

  try {

    return JSON.parse(
      localStorage.getItem(
        CUSTOMER_KEY
      ) || '[]'
    );

  } catch (error) {

    console.error(
      'Customer storage error:',
      error
    );

    return [];

  }

}


function getPayments() {

  try {

    return JSON.parse(
      localStorage.getItem(
        PAYMENT_KEY
      ) || '{}'
    );

  } catch (error) {

    console.error(
      'Payment storage error:',
      error
    );

    return {};

  }

}


function getPending() {

  try {

    return JSON.parse(
      localStorage.getItem(
        PENDING_KEY
      ) || '[]'
    );

  } catch (error) {

    console.error(
      'Pending storage error:',
      error
    );

    return [];

  }

}


/************************************************************
 * COUNTS
 ************************************************************/

function updateCounts() {

  const customerCount =
    document.getElementById(
      'customerCount'
    );


  const pendingCount =
    document.getElementById(
      'pendingCount'
    );


  if (customerCount) {

    customerCount.innerText =
      getCustomers().length;

  }


  if (pendingCount) {

    pendingCount.innerText =
      getPending().length;

  }

}


/************************************************************
 * DEFAULT PAYMENT MONTH
 ************************************************************/

function setDefaultPaymentFor() {

  const input =
    document.getElementById(
      'paymentFor'
    );


  if (!input) {

    return;

  }


  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  input.value =
    year + '-' + month;

}


/************************************************************
 * SEARCH CUSTOMER
 ************************************************************/

function searchCustomer() {

  const input =
    document.getElementById(
      'crfSearch'
    );


  const crf =
    input.value
      .trim()
      .toUpperCase();


  if (!crf) {

    showMessage(
      'searchMessage',
      'Please enter a CRF number.',
      false
    );

    return;

  }


  const customers =
    getCustomers();


  const customer =
    customers.find(
      function(item) {

        return String(
          item.crf || ''
        )
        .trim()
        .toUpperCase()
        === crf;

      }
    );


  if (!customer) {

    document.getElementById(
      'customerCard'
    ).style.display =
      'none';


    showMessage(
      'searchMessage',
      'Customer not found on this phone. Please synchronize customer data.',
      false
    );


    /*
     * Try synchronization immediately.
     */

    if (navigator.onLine) {

      syncNow(true);

    }


    return;

  }


  currentCustomer =
    customer;


  hideMessage(
    'searchMessage'
  );


  displayCustomer(
    customer
  );

}


/************************************************************
 * DISPLAY CUSTOMER
 ************************************************************/

function displayCustomer(
  customer
) {

  document.getElementById(
    'customerCard'
  ).style.display =
    'block';


  document.getElementById(
    'customerName'
  ).innerText =
    customer.name || '';


  document.getElementById(
    'customerCRF'
  ).innerText =
    customer.crf || '';


  document.getElementById(
    'customerAddress'
  ).innerText =
    customer.address || '';


  document.getElementById(
    'customerPhone'
  ).innerText =
    customer.phone || '';


  document.getElementById(
    'customerArea'
  ).innerText =
    customer.area || '';


  const payments =
    getPayments();


  const key =
    String(
      customer.crf || ''
    )
    .trim()
    .toUpperCase();


  const payment =
    payments[key];


  if (payment) {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      formatDisplayDate(
        payment.lastPaymentDate
      ) ||
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      formatDisplayDate(
        payment.paidThrough
      ) ||
      '-';

  } else {

    document.getElementById(
      'lastPaidDate'
    ).innerText =
      'No previous payment';


    document.getElementById(
      'paidThrough'
    ).innerText =
      '-';

  }

}


/************************************************************
 * SAVE COLLECTION
 ************************************************************/

function saveCollection() {

  if (!currentCustomer) {

    showMessage(
      'saveMessage',
      'Please search for a customer first.',
      false
    );

    return;

  }


  const paymentForDate =
    getPaymentForDate();


  if (!paymentForDate) {

    showMessage(
      'saveMessage',
      'Please select the month this collection is for.',
      false
    );

    return;

  }


  const remarks =
    document.getElementById(
      'remarks'
    )
    .value
    .trim();


  const transactionDate =
    new Date();


  const pending =
    getPending();


  pending.push({

    transactionId:
      createTransactionId(),

    transactionDate:
      transactionDate.toISOString(),

    coveredDate:
      paymentForDate.toISOString(),

    crf:
      currentCustomer.crf,

    agent:
      getAgent(),

    remarks:
      remarks

  });


  localStorage.setItem(
    PENDING_KEY,
    JSON.stringify(
      pending
    )
  );


  updateLocalPaymentSummary(
    currentCustomer.crf,
    transactionDate,
    paymentForDate
  );


  updateCounts();


  clearForm();


  showMessage(
    'saveMessage',

    navigator.onLine
      ? 'Collection saved. Synchronizing...'
      : 'Collection saved offline. It will synchronize when internet returns.',

    true
  );


  if (navigator.onLine) {

    syncNow(true);

  }

}


/************************************************************
 * LOCAL PAYMENT SUMMARY
 ************************************************************/

function updateLocalPaymentSummary(
  crf,
  transactionDate,
  paymentForDate
) {

  const payments =
    getPayments();


  const key =
    String(crf)
      .trim()
      .toUpperCase();


  const existing =
    payments[key];


  let paidThrough =
    new Date(
      paymentForDate
    );


  if (
    existing &&
    existing.paidThrough
  ) {

    const existingDate =
      new Date(
        existing.paidThrough
      );


    if (
      existingDate >
      paidThrough
    ) {

      paidThrough =
        existingDate;

    }

  }


  payments[key] = {

    lastPaymentDate:
      transactionDate.toISOString(),

    paidThrough:
      paidThrough.toISOString()

  };


  localStorage.setItem(
    PAYMENT_KEY,
    JSON.stringify(
      payments
    )
  );


  if (
    currentCustomer &&
    String(
      currentCustomer.crf
    )
    .trim()
    .toUpperCase()
    === key
  ) {

    displayCustomer(
      currentCustomer
    );

  }

}


/************************************************************
 * SYNCHRONIZATION
 *
 * IMPORTANT:
 *
 * This function ALWAYS sends a request to Apps Script,
 * even when pending.length === 0.
 *
 * Therefore a new phone can download customers.
 ************************************************************/

async function syncNow(
  manual
) {

  if (!navigator.onLine) {

    updateConnectionStatus();

    return;

  }


  if (syncInProgress) {

    return;

  }


  if (
    !API_URL ||
    API_URL ===
    'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE'
  ) {

    console.error(
      'API URL is not configured.'
    );


    document.getElementById(
      'syncStatus'
    ).innerText =
      'API URL is not configured.';


    return;

  }


  syncInProgress =
    true;


  const syncButton =
    document.getElementById(
      'syncButton'
    );


  if (syncButton) {

    syncButton.disabled =
      true;

    syncButton.classList.add(
      'loading'
    );

  }


  try {

    const pending =
      getPending();


    document.getElementById(
      'syncStatus'
    ).innerText =
      'Synchronizing customers...';


    console.log(
      'Sending synchronization request.'
    );


    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'sync',

              pending:
                pending,

              agent:
                getAgent()

            })

        }

      );


    console.log(
      'HTTP response:',
      response.status
    );


    if (!response.ok) {

      throw new Error(
        'Server returned HTTP ' +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      'Server response:',
      result
    );


    if (
      !result
    ) {

      throw new Error(
        'Empty response from server.'
      );

    }


    if (
      !result.success
    ) {

      throw new Error(

        result.message ||
        'Synchronization failed.'

      );

    }


    /******************************************************
     * SAVE CUSTOMERS
     ******************************************************/

    if (
      Array.isArray(
        result.customers
      )
    ) {

      localStorage.setItem(

        CUSTOMER_KEY,

        JSON.stringify(
          result.customers
        )

      );


      console.log(

        'Customers downloaded:',
        result.customers.length

      );

    }


    /******************************************************
     * SAVE PAYMENT SUMMARY
     ******************************************************/

    if (
      result.payments &&
      typeof result.payments === 'object'
    ) {

      localStorage.setItem(

        PAYMENT_KEY,

        JSON.stringify(
          result.payments
        )

      );

    }


    /******************************************************
     * REMOVE SUCCESSFULLY SYNCED COLLECTIONS
     ******************************************************/

    const syncedIds =
      new Set(

        Array.isArray(
          result.syncedIds
        )
          ? result.syncedIds
          : []

      );


    const remaining =
      pending.filter(
        function(item) {

          return !syncedIds.has(
            item.transactionId
          );

        }
      );


    localStorage.setItem(

      PENDING_KEY,

      JSON.stringify(
        remaining
      )

    );


    /******************************************************
     * UPDATE SCREEN
     ******************************************************/

    updateCounts();


    /******************************************************
     * REFRESH CURRENT CUSTOMER
     ******************************************************/

    if (
      currentCustomer
    ) {

      const customers =
        getCustomers();


      const updated =
        customers.find(
          function(item) {

            return String(
              item.crf || ''
            )
            .trim()
            .toUpperCase()
            ===
            String(
              currentCustomer.crf || ''
            )
            .trim()
            .toUpperCase();

          }
        );


      if (updated) {

        currentCustomer =
          updated;

        displayCustomer(
          updated
        );

      }

    }


    /******************************************************
     * STATUS
     ******************************************************/

    const customerTotal =
      getCustomers().length;


    const pendingTotal =
      getPending().length;


    document.getElementById(
      'syncStatus'
    ).innerText =

      'Synchronized successfully. ' +
      customerTotal +
      ' customers on phone. ' +
      pendingTotal +
      ' pending collection(s).';


    if (
      manual
    ) {

      showMessage(

        'searchMessage',

        customerTotal +
        ' customers synchronized successfully.',

        true

      );

    }


    console.log(
      'Synchronization completed.'
    );


  } catch (error) {

    console.error(
      'Synchronization error:',
      error
    );


    updateCounts();


    document.getElementById(
      'syncStatus'
    ).innerText =

      'Synchronization failed: ' +
      error.message;


    if (
      manual
    ) {

      showMessage(

        'searchMessage',

        'Synchronization failed: ' +
        error.message,

        false

      );

    }


  } finally {

    syncInProgress =
      false;


    if (syncButton) {

      syncButton.disabled =
        false;

      syncButton.classList.remove(
        'loading'
      );

    }

  }

}


/************************************************************
 * AGENT
 ************************************************************/

function getAgent() {

  try {

    const agent =
      JSON.parse(

        localStorage.getItem(
          AGENT_KEY
        ) || 'null'

      );


    if (
      agent &&
      agent.agentId
    ) {

      return String(
        agent.agentId
      ).trim();

    }

  } catch (error) {

    console.error(
      'Agent storage error:',
      error
    );

  }


  return 'AG001';

}


/************************************************************
 * TRANSACTION ID
 ************************************************************/

function createTransactionId() {

  return (

    'COL-' +

    Date.now().toString(36) +

    '-' +

    Math.random()
      .toString(36)
      .substring(2, 10)

  );

}


/************************************************************
 * PAYMENT-FOR DATE
 ************************************************************/

function getPaymentForDate() {

  const input =
    document.getElementById(
      'paymentFor'
    );


  if (!input) {

    return null;

  }


  const value =
    input.value;


  if (!value) {

    return null;

  }


  const parts =
    value.split('-');


  if (
    parts.length !== 2
  ) {

    return null;

  }


  const year =
    Number(
      parts[0]
    );


  const month =
    Number(
      parts[1]
    );


  if (
    !year ||
    month < 1 ||
    month > 12
  ) {

    return null;

  }


  return new Date(
    year,
    month - 1,
    1
  );

}


/************************************************************
 * DATE FORMAT
 ************************************************************/

function formatDate(
  date
) {

  const d =
    new Date(
      date
    );


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return '-';

  }


  const months = [

    'JANUARY',
    'FEBRUARY',
    'MARCH',
    'APRIL',
    'MAY',
    'JUNE',
    'JULY',
    'AUGUST',
    'SEPTEMBER',
    'OCTOBER',
    'NOVEMBER',
    'DECEMBER'

  ];


  return (

    String(
      d.getDate()
    )
    .padStart(
      2,
      '0'
    ) +

    ' ' +

    months[
      d.getMonth()
    ] +

    ' ' +

    d.getFullYear()

  );

}


function formatDisplayDate(
  value
) {

  if (!value) {

    return '';

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  return formatDate(
    date
  );

}


/************************************************************
 * CLEAR FORM
 ************************************************************/

function clearForm() {

  const remarks =
    document.getElementById(
      'remarks'
    );


  if (remarks) {

    remarks.value =
      '';

  }


  setDefaultPaymentFor();

}


/************************************************************
 * MESSAGES
 ************************************************************/

function showMessage(
  id,
  message,
  success
) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message ' +
    (
      success
        ? 'success'
        : 'error'
    );


  element.innerText =
    message;

}


function hideMessage(
  id
) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  element.className =
    'message';


  element.innerText =
    '';

}


/************************************************************
 * START
 *
 * DOMContentLoaded guarantees the HTML exists before
 * JavaScript starts touching the screen.
 ************************************************************/

if (
  document.readyState === 'loading'
) {

  document.addEventListener(
    'DOMContentLoaded',
    startApplication
  );

} else {

  startApplication();

}

</script>
